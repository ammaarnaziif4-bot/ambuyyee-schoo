<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Login | AMBUYEE SCHOOL</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #071d38;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 22px;
            padding: 38px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #cfa23b;
            color: #071d38;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            margin: 0 auto 18px;
        }

        h1 {
            text-align: center;
            color: #071d38;
            margin: 0;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #7b8798;
            margin: 8px 0 30px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #10243d;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #dce3eb;
            border-radius: 10px;
            padding: 0 14px;
            margin-bottom: 18px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #cfa23b;
        }

        button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 10px;
            background: #071d38;
            color: white;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #cfa23b;
            color: #071d38;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #071d38;
            text-decoration: none;
            font-size: 13px;
        }

        .flash {
            background: #fff1f1;
            color: #b42318;
            padding: 11px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">AS</div>

        <h1>Director Login</h1>
        <p class="subtitle">AMBUYEE SCHOOL Management System</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter director username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">LOGIN AS DIRECTOR</button>
        </form>

        <a href="/login" class="back">← Back to Login</a>
    </div>
</body>
</html>
