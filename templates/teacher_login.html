<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | AMBUYEE SCHOOL</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/teacher_login.css') }}">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="school-logo">
            AS
        </div>

        <h1>AMBUYEE SCHOOL</h1>

        <p class="login-subtitle">
            Teacher Portal
        </p>

        <form method="POST"
              action="{{ url_for('teacher_login') }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username">

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password">

            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}

                <div class="flash-messages">

                    {% for message in messages %}

                        <div class="flash-message">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}
        {% endwith %}

        <a href="{{ url_for('home') }}"
           class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
