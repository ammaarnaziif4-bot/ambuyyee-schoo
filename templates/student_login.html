<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Ambuyyee School</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071b3a, #10243e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 30px 70px rgba(0,0,0,.28);
        }

        .logo {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #10243e;
            color: #d8b56d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 900;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #10243e;
            font-size: 27px;
        }

        .subtitle {
            margin: 9px 0 32px;
            text-align: center;
            color: #718096;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #26364c;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #dce2e9;
            border-radius: 10px;
            padding: 0 15px;
            margin-bottom: 20px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #b58a45;
            box-shadow: 0 0 0 3px rgba(181,138,69,.10);
        }

        button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 10px;
            background: #10243e;
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: #b58a45;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #10243e;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .back:hover {
            color: #b58a45;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">A</div>

        <h1>Student Login</h1>

        <p class="subtitle">
            Login to view your registration status
        </p>

        <form method="POST">

            <label for="national_id">National ID</label>
            <input
                type="text"
                id="national_id"
                name="national_id"
                placeholder="Enter your National ID"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/login" class="back">
            ← Back to Login Options
        </a>

    </div>

</body>
</html>
